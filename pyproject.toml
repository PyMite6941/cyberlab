[project]
name = "cyberlab"
version = "2.0.0.dev0"
description = "Offline cyber range for local cybersecurity practice"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cyberlab = "cyberlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["v2/cyberlab"]
