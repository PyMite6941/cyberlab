[project]
name = "cyberterminal"
version = "0.1.0"
description = "Custom emulated terminal for offline cybersecurity practice (BurpSuite + Wireshark simulators)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cyberterminal = "src.terminal:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
