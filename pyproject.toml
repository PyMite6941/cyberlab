[project]
name = "cyberlab"
version = "0.1.0"
description = "Offline-first cybersecurity practice CLI with simulated BurpSuite and Wireshark labs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.scripts]
cyberlab = "cyberlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberlab"]
