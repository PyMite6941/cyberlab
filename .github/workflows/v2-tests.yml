# Tests for the v2 cyberlab CLI on the Pythons Linux Mint ships:
# 3.12 (Mint 22) and 3.10 (Mint 21). Standard library only, no installs.
name: v2-tests

on:
  workflow_dispatch:
  push:
    paths:
      - "v2/cyberlab/**"
      - "v2/tests/**"
      - "tests/smoke_cyberlab.py"
      - "v2/bin/**"
      - "cyberlab.bat"
      - "cyberlab.sh"
      - "run.bat"
      - "run.sh"
      - "install.bat"
      - "install.sh"
      - "pyproject.toml"
      - "README.md"
      - "EXPANSION.md"
      - ".github/workflows/v2-tests.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        working-directory: v2
        run: python3 -m unittest discover -s tests -v
      - name: Supported root CLI smoke test
        run: python3 tests/smoke_cyberlab.py
      - name: The launcher works from anywhere
        env:
          CYBERLAB_HOME: ${{ runner.temp }}/cyberlab
          PYTHONPATH: ${{ github.workspace }}/v2
        run: |
          cd /tmp
          python3 -m cyberlab --version
          bash "$GITHUB_WORKSPACE/cyberlab.sh" list
          "$GITHUB_WORKSPACE/v2/bin/cyberlab" --version
          "$GITHUB_WORKSPACE/v2/bin/cyberlab" list

  # The network captures claim to open in Wireshark; prove it with tshark,
  # the tool students actually use, not just our own parser.
  pcap-dissection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
      - name: Generate the captures
        working-directory: v2
        env:
          CYBERLAB_HOME: ${{ runner.temp }}/cyberlab
        run: |
          for c in net-http-creds net-port-scan net-dns-tunnel; do
            PYTHONPATH=. python3 -m cyberlab start "$c"
          done
      - name: tshark dissects them as HTTP / DNS / TCP
        env:
          CYBERLAB_HOME: ${{ runner.temp }}/cyberlab
        run: |
          set -e
          echo "== http creds: tshark sees an HTTP POST carrying the password =="
          # Match on the dissected HTTP method (proves HTTP dissection) plus the
          # raw bytes (dissector-agnostic: urlencoded bodies aren't in http.file_data).
          tshark -r "$CYBERLAB_HOME/net-http-creds/capture.pcap" \
                 -Y 'http.request.method=="POST" && frame contains "password"' \
                 -T fields -e http.request.method | grep -q POST
          echo "== port scan: SYNs from several sources =="
          test "$(tshark -r "$CYBERLAB_HOME/net-port-scan/capture.pcap" \
                 -Y 'tcp.flags.syn==1 && tcp.flags.ack==0' -T fields -e ip.src | sort -u | wc -l)" -ge 2
          echo "== dns tunnel: TXT queries present =="
          tshark -r "$CYBERLAB_HOME/net-dns-tunnel/capture.pcap" -Y 'dns.qry.type==16' \
                 -T fields -e dns.qry.name | grep -q .
          echo "all captures dissected"
