<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cyberterminal - Training Portal</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0b0c10;
    color: #c0c0c0;
    margin: 0;
    padding: 24px;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  header {
    border-bottom: 2px solid #1f2833;
    padding-bottom: 16px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand .logo { width: 36px; height: 36px; }
  .brand h1 { margin: 0; color: #66fcf1; font-size: 24px; }
  .brand h1 span { color: #45a29e; }
  .brand p.sub { margin: 2px 0 0; color: #888; font-size: 12px; }

  .progress-card {
    background: #12161c;
    border: 1px solid #1f2833;
    border-radius: 8px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .progress-item { display: flex; align-items: center; gap: 8px; }
  .progress-item .label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .progress-item .value { color: #66fcf1; font-size: 20px; font-weight: bold; font-family: ui-monospace, SFMono-Regular, monospace; }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: #1f2833;
    border-radius: 4px;
    overflow: hidden;
    min-width: 150px;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, #66fcf1, #45a29e);
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-text { font-size: 12px; color: #888; }

  .controls-card {
    background: #12161c;
    border: 1px solid #1f2833;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .controls-card label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-right: 8px; }
  .chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 6px 14px;
    border: 1px solid #1f2833;
    border-radius: 20px;
    background: #0b0c10;
    color: #c0c0c0;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .chip:hover { border-color: #66fcf1; }
  .chip.active { background: #45a29e; color: #0b0c10; border-color: #45a29e; }

  .submission-card {
    background: #12161c;
    border: 1px solid #1f2833;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
    max-width: 600px;
  }
  .submission-card h3 { margin: 0 0 12px; color: #66fcf1; font-size: 16px; }
  .submission-card .form-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .submission-card input[type="text"] {
    flex: 1;
    padding: 10px 16px;
    font-size: 14px;
    border: 1px solid #1f2833;
    border-radius: 6px;
    background: #0b0c10;
    color: #c0c0c0;
    outline: none;
    min-width: 200px;
  }
  .submission-card input[type="text"]:focus { border-color: #66fcf1; }
  .submission-card button {
    padding: 10px 20px;
    font-size: 14px;
    border: 1px solid #45a29e;
    border-radius: 6px;
    background: #45a29e;
    color: #0b0c10;
    cursor: pointer;
    font-weight: bold;
  }
  .submission-card button:hover { background: #66fcf1; }
  .submission-card button:disabled { opacity: 0.5; cursor: not-allowed; }
  .submission-result { margin-top: 10px; font-size: 13px; font-weight: bold; min-height: 18px; }
  .submission-result.success { color: #66fcf1; }
  .submission-result.error { color: #ff6b6b; }

  .tutorials { display: grid; gap: 16px; }
  .tut {
    background: #12161c;
    border: 1px solid #1f2833;
    border-radius: 8px;
    padding: 18px;
    cursor: pointer;
    transition: border 0.2s, background 0.2s, transform 0.2s;
    display: flex;
    flex-direction: column;
  }
  .tut:hover { border-color: #66fcf1; background: #161b22; transform: translateY(-2px); }
  .tut.completed { border-color: #45a29e; background: #131a16; }
  .tut-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .tut h3 { margin: 0; color: #66fcf1; font-size: 16px; }
  .tut .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: bold;
  }
  .badge.easy { background: #45a29e; color: #0b0c10; }
  .badge.medium { background: #f5a623; color: #0b0c10; }
  .badge.hard { background: #ff6b6b; color: #ffffff; }
  .tut .meta { font-size: 11px; color: #888; margin-bottom: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
  .tut .cat { background: #1f2833; padding: 2px 8px; border-radius: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .tut p { margin: 0 0 12px; color: #a0a0a0; font-size: 13px; line-height: 1.45; }
  .tut .vuln {
    font-size: 11px;
    color: #45a29e;
    font-family: ui-monospace, SFMono-Regular, monospace;
    background: #0b0c10;
    padding: 2px 8px;
    border-radius: 3px;
    border: 1px solid #1f2833;
    display: inline-block;
    margin-bottom: 10px;
  }
  .tut .steps {
    font-size: 12px;
    color: #66fcf1;
    margin-bottom: 10px;
  }
  .tut .cmd {
    color: #45a29e;
    font-family: ui-monospace, SFMono-Regular, monospace;
    background: #0b0c10;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid #1f2833;
    margin-right: 6px;
    display: inline-block;
    margin-bottom: 4px;
  }
  .tut .ai-hint {
    font-size: 11px;
    color: #f5a623;
    margin-top: 8px;
    padding: 8px;
    background: #1a1f26;
    border: 1px dashed #334155;
    border-radius: 4px;
    display: none;
  }
  .tut .ai-hint.show { display: block; }
  .empty {
    text-align: center;
    padding: 40px;
    color: #888;
    font-style: italic;
  }

  .ai-panel {
    background: #12161c;
    border: 1px solid #1f2833;
    border-radius: 8px;
    padding: 20px;
    margin-top: 24px;
    max-width: 800px;
  }
  .ai-panel h3 { margin: 0 0 12px; color: #66fcf1; font-size: 16px; }
  .ai-panel .ai-output {
    background: #0b0c10;
    border: 1px solid #1f2833;
    border-radius: 6px;
    padding: 14px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 13px;
    color: #a0a0a0;
    min-height: 80px;
    white-space: pre-wrap;
  }
  .ai-panel button {
    padding: 8px 16px;
    font-size: 13px;
    border: 1px solid #45a29e;
    border-radius: 6px;
    background: #45a29e;
    color: #0b0c10;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
  }
  .ai-panel button:hover { background: #66fcf1; }

  .track-section { margin-bottom: 32px; }
  .track-section h2 {
    color: #66fcf1;
    font-size: 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .track-section h2 .track-icon { color: #45a29e; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <img class="logo" src="assets/logo.svg" alt="cyberterminal logo">
      <div>
        <h1>cyberterminal <span>Training</span></h1>
        <p class="sub">Offline-first cybersecurity practice &bull; Track your progress</p>
      </div>
    </div>
    <div class="progress-card">
      <div class="progress-item">
        <span class="label">tutorials completed</span>
        <span class="value" id="completedCount">0</span>
      </div>
      <span>/</span>
      <div class="progress-item">
        <span class="label">total</span>
        <span class="value" id="totalCount">0</span>
      </div>
      <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText">0%</span>
    </div>
  </header>

  <div class="controls-card">
    <div class="chip-group" id="trackChips"></div>
    <div class="chip-group" style="margin-left:auto;">
      <label>difficulty:</label>
      <span class="chip active" data-diff="all">All</span>
      <span class="chip" data-diff="easy">Easy</span>
      <span class="chip" data-diff="medium">Medium</span>
      <span class="chip" data-diff="hard">Hard</span>
    </div>
  </div>

  <div class="submission-card">
    <h3>Submit Answer</h3>
    <div class="form-group">
      <input type="text" id="flagInput" placeholder="Enter your answer" maxlength="128">
      <input type="hidden" id="currentTutorialId">
      <button id="submitBtn">Submit</button>
    </div>
    <div class="submission-result" id="submitResult"></div>
  </div>

  <div class="tutorials" id="list"></div>
  <div class="empty" id="empty" style="display:none;">No tutorials match your filters.</div>

  <div class="ai-panel">
    <h3>AI Hint</h3>
    <p style="font-size:12px;color:#888;margin-bottom:10px;">Get a hint for the selected tutorial (AI-assisted guidance).</p>
    <div class="ai-output" id="aiOutput">Select a tutorial to see a hint here.</div>
    <button id="aiHintBtn">Get Hint</button>
  </div>
</div>

<script>
// Tutorial data embedded at build time for offline use.
const TUTORIALS_DATA = TUTORIALS_JSON || [];
const TRACKS_DATA = TRACKS_JSON || [];

let currentTrack = 'all';
let currentDiff = 'all';
let selectedTutorial = null;

const listEl = document.getElementById('list');
const trackChipsEl = document.getElementById('trackChips');
const diffChipsEl = document.querySelectorAll('.chip[data-diff]');
const completedCountEl = document.getElementById('completedCount');
const totalCountEl = document.getElementById('totalCount');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const flagInput = document.getElementById('flagInput');
const currentTutId = document.getElementById('currentTutorialId');
const submitBtn = document.getElementById('submitBtn');
const submitResult = document.getElementById('submitResult');
const emptyEl = document.getElementById('empty');
const aiOutput = document.getElementById('aiOutput');
const aiHintBtn = document.getElementById('aiHintBtn');

let submissions = JSON.parse(localStorage.getItem('cyberterminal_submissions') || '[]');

function saveSubmissions() {
  localStorage.setItem('cyberterminal_submissions', JSON.stringify(submissions));
  updateProgress();
}

function isCompleted(tutId) {
  return submissions.some(s => s.tutorialId === tutId && s.correct);
}

function updateProgress() {
  const total = TUTORIALS_DATA.length;
  const completed = submissions.filter(s => s.correct).length;
  completedCountEl.textContent = completed;
  totalCountEl.textContent = total;
  const pct = total ? Math.round(completed / total * 100) : 0;
  progressFill.style.width = pct + '%';
  progressText.textContent = pct + '%';
}

function renderTracks() {
  trackChipsEl.innerHTML = '';
  const allChip = document.createElement('span');
  allChip.className = 'chip active';
  allChip.textContent = 'All Tracks';
  allChip.onclick = () => { setTrack('all'); };
  trackChipsEl.appendChild(allChip);

  TRACKS_DATA.forEach(tr => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = tr.title;
    chip.onclick = () => { setTrack(tr.id); };
    trackChipsEl.appendChild(chip);
  });
}

function setTrack(trackId) {
  currentTrack = trackId;
  document.querySelectorAll('#trackChips .chip').forEach(c => {
    c.classList.toggle('active', (c.textContent === 'All Tracks' && trackId === 'all') ||
      (c.textContent !== 'All Tracks' && trackId !== 'all' && TRACKS_DATA.find(t => t.id === trackId && t.title === c.textContent)));
  });
  render();
}

function setDiff(diff) {
  currentDiff = diff;
  diffChipsEl.forEach(c => c.classList.toggle('active', c.getAttribute('data-diff') === diff));
  render();
}

function matchesFilters(t) {
  if (currentTrack !== 'all' && t.track !== currentTrack) return false;
  if (currentDiff !== 'all' && t.difficulty !== currentDiff) return false;
  return true;
}

function render() {
  listEl.innerHTML = '';
  let shown = 0;

  for (const t of TUTORIALS_DATA) {
    if (!matchesFilters(t)) continue;
    shown++;

    const el = document.createElement('div');
    el.className = 'tut' + (isCompleted(t.id) ? ' completed' : '');
    el.onclick = () => selectTutorial(t);

    const stepsHtml = t.steps.map(s => `<span class="cmd">${escapeHtml(s.command)}</span>`).join('');

    el.innerHTML = `
      <div class="tut-header">
        <h3>${escapeHtml(t.title)}</h3>
        <span class="badge ${t.difficulty}">${t.difficulty}</span>
      </div>
      <div class="meta">
        <span class="cat">${t.category}</span>
        <span class="cat">vuln: ${t.vulnerability}</span>
        <span class="cat">module: ${t.module}</span>
      </div>
      <p>${escapeHtml(t.description)}</p>
      <div class="vuln">Vulnerability: ${t.vulnerability}</div>
      <div class="steps">${stepsHtml}</div>
      ${t.ai_enabled ? '<div class="ai-hint" id="ai-hint-' + t.id + '"><strong>AI Hint available:</strong> Click "Get Hint" for guidance.</div>' : ''}
      ${isCompleted(t.id) ? '<div style="color:#45a29e;font-size:11px;margin-top:8px;"><strong>Completed</strong> ✓</div>' : ''}
    `;
    listEl.appendChild(el);
  }

  emptyEl.style.display = shown === 0 ? 'block' : 'none';
}

function selectTutorial(t) {
  selectedTutorial = t;
  currentTutId.value = t.id;
  flagInput.value = '';
  submitResult.textContent = '';

  const hints = document.querySelectorAll('.ai-hint');
  hints.forEach(h => h.classList.remove('show'));
  const hintEl = document.getElementById('ai-hint-' + t.id);
  if (hintEl) hintEl.classList.add('show');

  aiOutput.textContent = 'Selected: ' + t.title + '\nVulnerability: ' + t.vulnerability + '\nDifficulty: ' + t.difficulty + '\n\nClick "Get Hint" for AI-assisted guidance.';
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function submitFlag() {
  if (!selectedTutorial) {
    submitResult.textContent = 'Please select a tutorial first.';
    submitResult.className = 'submission-result error';
    return;
  }
  const flag = flagInput.value.trim();
  if (!flag) {
    submitResult.textContent = 'Please enter a flag.';
    submitResult.className = 'submission-result error';
    return;
  }

  const expected = selectedTutorial.flag;
  const correct = expected && flag.toLowerCase() === expected.toLowerCase();

  if (correct) {
    submitResult.textContent = 'Correct! Tutorial completed.';
    submitResult.className = 'submission-result success';
    if (!submissions.some(s => s.tutorialId === selectedTutorial.id && s.correct)) {
      submissions.push({
        tutorialId: selectedTutorial.id,
        flag: flag,
        correct: true,
        timestamp: new Date().toISOString()
      });
      saveSubmissions();
    }
    render();
    if (selectedTutorial) selectTutorial(selectedTutorial);
  } else {
    submitResult.textContent = 'Incorrect flag. Try again.';
    submitResult.className = 'submission-result error';
    submissions.push({
      tutorialId: selectedTutorial.id,
      flag: flag,
      correct: false,
      timestamp: new Date().toISOString()
    });
    saveSubmissions();
  }
}

function getAIHint() {
  if (!selectedTutorial) {
    aiOutput.textContent = 'Please select a tutorial first.';
    return;
  }
  const t = selectedTutorial;
  let hint = '';
  if (t.difficulty === 'easy') {
    hint = `AI Hint (Easy): You're working on "${t.title}".\nVulnerability: ${t.vulnerability}\nTry the commands shown in the steps above in order.\nSubmit your answer in the "Submit Answer" box above.`;
  } else if (t.difficulty === 'medium') {
    hint = `AI Hint (Medium): "${t.title}" isolates the ${t.vulnerability} vulnerability.\nFocus on the specific parameter or field being manipulated.\nReview each step's command carefully before submitting.\nSubmit the flag when you've confirmed the vulnerability.`;
  } else {
    hint = `AI Hint (Hard): "${t.title}" targets ${t.vulnerability}.\nThis requires careful manipulation of the request/response.\nPay attention to filters and bypass techniques.\nNo walkthrough provided - identify the issue yourself.`;
  }
  aiOutput.textContent = hint;
}

diffChipsEl.forEach(c => c.addEventListener('click', () => setDiff(c.getAttribute('data-diff'))));
submitBtn.addEventListener('click', submitFlag);
flagInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitFlag(); });
aiHintBtn.addEventListener('click', getAIHint);

renderTracks();
render();
updateProgress();
</script>
</body>
</html>
