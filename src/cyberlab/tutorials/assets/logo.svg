<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="cyberlab logo">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66fcf1"/>
      <stop offset="100%" stop-color="#45a29e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background shield -->
  <path d="M32 2 C20 2 10 8 10 20 L10 46 L32 62 L54 46 L54 20 C54 8 44 2 32 2 Z"
        fill="#12161c" stroke="#66fcf1" stroke-width="2"/>

  <!-- Inner circuit traces -->
  <path d="M20 22 L44 22" stroke="#1f2833" stroke-width="2"/>
  <path d="M20 30 L44 30" stroke="#1f2833" stroke-width="2"/>
  <path d="M22 22 L22 30" stroke="#1f2833" stroke-width="2"/>
  <path d="M42 22 L42 30" stroke="#1f2833" stroke-width="2"/>
  <circle cx="26" cy="26" r="1.5" fill="#66fcf1"/>
  <circle cx="38" cy="26" r="1.5" fill="#66fcf1"/>

  <!-- Terminal prompt bracket -->
  <path d="M32 42 L36 42 L36 48 L32 48 Z" fill="none" stroke="#66fcf1" stroke-width="2.5"/>
  <path d="M36 48 L40 48" stroke="#66fcf1" stroke-width="2.5"/>

  <!-- Glow on shield border -->
  <path d="M32 2 C20 2 10 8 10 20 L10 46 L32 62 L54 46 L54 20 C54 8 44 2 32 2 Z"
        fill="none" stroke="#66fcf1" stroke-width="1" opacity="0.4" filter="url(#glow)"/>
</svg>
