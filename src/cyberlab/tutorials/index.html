<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cyberlab - Tutorial Search</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/logo.svg">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0b0c10;
    color: #c0c0c0;
    margin: 0;
    padding: 24px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header {
    border-bottom: 2px solid #1f2833;
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .logo {
    width: 40px;
    height: 40px;
    display: inline-block;
    vertical-align: middle;
    margin-right: 10px;
  }
  .logo svg { width: 100%; height: 100%; }
  h1 { margin: 0; color: #66fcf1; font-size: 28px; display: inline-block; vertical-align: middle; }
  h1 span { color: #45a29e; }
  p.sub { margin: 6px 0 0; color: #888; font-size: 14px; }

  .search-card {
    background: #12161c;
    border: 1px solid #1f2833;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
  }
  #search {
    width: 100%;
    padding: 12px 16px;
    font-size: 15px;
    border: 1px solid #1f2833;
    border-radius: 6px;
    background: #0b0c10;
    color: #c0c0c0;
    outline: none;
  }
  #search:focus { border-color: #66fcf1; }

  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .chip {
    padding: 6px 12px;
    border: 1px solid #1f2833;
    border-radius: 20px;
    background: #0b0c10;
    color: #c0c0c0;
    cursor: pointer;
    font-size: 13px;
  }
  .chip.active { background: #45a29e; color: #0b0c10; border-color: #45a29e; }
  .chip:hover { border-color: #66fcf1; }

  .tutorials { display: grid; gap: 12px; }
  .tut {
    background: #12161c;
    border: 1px solid #1f2833;
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    transition: border 0.2s, background 0.2s;
  }
  .tut:hover { border-color: #66fcf1; background: #161b22; }
  .tut h3 { margin: 0 0 6px; color: #66fcf1; font-size: 16px; }
  .tut .meta { font-size: 12px; color: #888; margin-bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tut .cat { background: #1f2833; padding: 2px 8px; border-radius: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .tut p { margin: 0 0 10px; color: #a0a0a0; font-size: 13px; line-height: 1.45; }
  .tut .steps { font-size: 12px; color: #66fcf1; }
  .tut .cmd {
    color: #45a29e;
    font-family: ui-monospace, SFMono-Regular, monospace;
    background: #0b0c10;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid #1f2833;
    margin-right: 6px;
    display: inline-block;
    margin-bottom: 4px;
  }
  .empty {
    text-align: center;
    padding: 40px;
    color: #888;
    font-style: italic;
  }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #1f2833; color: #888; margin-left: 8px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#66fcf1"/><stop offset="100%" stop-color="#45a29e"/></linearGradient></defs><path d="M32 2 C20 2 10 8 10 20 L10 46 L32 62 L54 46 L54 20 C54 8 44 2 32 2 Z" fill="#12161c" stroke="#66fcf1" stroke-width="2"/><path d="M20 22 L44 22" stroke="#1f2833" stroke-width="2"/><path d="M20 30 L44 30" stroke="#1f2833" stroke-width="2"/><path d="M22 22 L22 30" stroke="#1f2833" stroke-width="2"/><path d="M42 22 L42 30" stroke="#1f2833" stroke-width="2"/><circle cx="26" cy="26" r="1.5" fill="#66fcf1"/><circle cx="38" cy="26" r="1.5" fill="#66fcf1"/><path d="M32 42 L36 42 L36 48 L32 48 Z" fill="none" stroke="#66fcf1" stroke-width="2.5"/><path d="M36 48 L40 48" stroke="#66fcf1" stroke-width="2.5"/></svg></span>cyberlab <span>Tutorials</span></h1>
    <p class="sub">Offline-first cybersecurity practice &bull; Search, filter, and open tutorials</p>
  </header>

  <div class="search-card">
    <input type="text" id="search" placeholder="Search tutorials (title, description, commands...)">
    <div class="filters">
      <span class="chip active" data-cat="all">All</span>
      <span class="chip" data-cat="web">Web</span>
      <span class="chip" data-cat="network">Network</span>
    </div>
    <div class="count" style="margin-top:10px;font-size:12px;color:#888;"></div>
  </div>

  <div class="tutorials" id="list"></div>
  <div class="empty" id="empty" style="display:none;">No tutorials match your search.</div>
</div>

<script>
// Tutorial data embedded at build time by the install/verify step.
const TUTORIALS_DATA = {
  "version": "1.0",
  "tutorials": [
    {
      "id": "burp-basics",
      "title": "BurpSuite Basics - Intercept & Modify",
      "category": "web",
      "module": "burp",
      "description": "Learn to intercept and modify HTTP requests with the simulated intercepting proxy.",
      "steps": [
        {
          "description": "Start the Burp simulator and list available targets.",
          "command": "burp",
          "notes": "Inside the shell, type 'targets' to see endpoints."
        },
        {
          "description": "Intercept a login request.",
          "command": "intercept POST /login username=admin&password=wrong",
          "notes": "This captures the request before it reaches the target."
        },
        {
          "description": "Modify the username to 'admin'.",
          "command": "modify body username=admin",
          "notes": "Change the request body on the fly."
        },
        {
          "description": "Forward the request and view the response.",
          "command": "forward",
          "notes": "Send the modified request to the simulated target."
        }
      ]
    },
    {
      "id": "burp-sql-injection",
      "title": "Simulated SQL Injection via Proxy",
      "category": "web",
      "module": "burp",
      "description": "Practice injecting SQL payloads through the intercepting proxy.",
      "steps": [
        {
          "description": "Intercept a search request.",
          "command": "intercept GET /search?q=test",
          "notes": "Capture a GET request with a query parameter."
        },
        {
          "description": "Inject a SQL payload.",
          "command": "modify body q=1' OR '1'='1",
          "notes": "Replace the search query with a SQL injection payload."
        },
        {
          "description": "Forward and observe the response.",
          "command": "forward",
          "notes": "See how the simulated target responds."
        }
      ]
    },
    {
      "id": "wireshark-basics",
      "title": "Wireshark Basics - Packet Inspection",
      "category": "network",
      "module": "wireshark",
      "description": "Learn to inspect, filter, and analyze simulated network packets.",
      "steps": [
        {
          "description": "Start the Wireshark simulator.",
          "command": "wireshark",
          "notes": "Generates 25 simulated packets and opens the capture shell."
        },
        {
          "description": "List all packets.",
          "command": "list",
          "notes": "View the full packet table."
        },
        {
          "description": "Filter to HTTP packets only.",
          "command": "list proto==HTTP",
          "notes": "Apply a display filter."
        },
        {
          "description": "Export to pcap for real Wireshark.",
          "command": "export capture.pcap",
          "notes": "Save a real pcap file you can open in Wireshark."
        }
      ]
    },
    {
      "id": "wireshark-dns-analysis",
      "title": "DNS Traffic Analysis",
      "category": "network",
      "module": "wireshark",
      "description": "Analyze simulated DNS queries and responses.",
      "steps": [
        {
          "description": "Generate a capture with DNS packets.",
          "command": "wireshark --packets 40",
          "notes": "More packets increases DNS sample size."
        },
        {
          "description": "Filter to DNS protocol.",
          "command": "list proto==DNS",
          "notes": "Show only DNS packets."
        },
        {
          "description": "Count packets by protocol.",
          "command": "count",
          "notes": "See protocol distribution."
        }
      ]
    }
  ]
}
;
const TUTORIALS = TUTORIALS_DATA;

const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const countEl = document.querySelector('.count');
const emptyEl = document.getElementById('empty');
const chips = document.querySelectorAll('.chip');

let currentCat = 'all';

function render() {
  const q = searchEl.value.toLowerCase();
  listEl.innerHTML = '';
  let shown = 0;

  for (const t of TUTORIALS) {
    const matchCat = currentCat === 'all' || t.category === currentCat;
    const matchText =
      t.title.toLowerCase().includes(q) ||
      t.description.toLowerCase().includes(q) ||
      t.category.toLowerCase().includes(q) ||
      t.steps.some(s => s.command.toLowerCase().includes(q) || s.description.toLowerCase().includes(q));
    if (!matchCat || !matchText) continue;

    shown++;
    const el = document.createElement('div');
    el.className = 'tut';
    el.innerHTML = `
      <h3>${escapeHtml(t.title)} <span class="badge">${t.id}</span></h3>
      <div class="meta">
        <span class="cat">${t.category}</span>
        <span class="cat">module: ${t.module}</span>
      </div>
      <p>${escapeHtml(t.description)}</p>
      <div class="steps">
        ${t.steps.map(s => `<span class="cmd">${escapeHtml(s.command)}</span>`).join('')}
      </div>
    `;
    el.onclick = () => {
      // Launch the tutorial in the cyberlab shell if available, otherwise just highlight.
      if (window.cyberlabOpenTutorial) {
        window.cyberlabOpenTutorial(t.id);
      } else {
        alert('Open this tutorial in cyberlab:  cyberlab tutorial ' + t.id);
      }
    };
    listEl.appendChild(el);
  }

  countEl.textContent = shown + ' tutorial' + (shown === 1 ? '' : 's') + ' of ' + TUTORIALS.length;
  emptyEl.style.display = shown === 0 ? 'block' : 'none';
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

searchEl.addEventListener('input', render);
chips.forEach(c => {
  c.addEventListener('click', () => {
    chips.forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    currentCat = c.getAttribute('data-cat');
    render();
  });
});

render();
</script>
</body>
</html>
